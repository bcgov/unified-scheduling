services:
  runner:
    env_file: [.env.rollback.local]
    environment:
      DatabaseConnectionString: Host=target;Database=unified_ss_rehearsal_ready_v4_rollback;Username=postgres
      DataMigration__Sources__SS__ConnectionString: Host=source;Database=ss_ready_v4;Username=ss_migration_reader
      DataMigrationRollback__ExportDirectory: /restricted/private
      DataMigration__Sources__SS__Jobs__MyTeam__BatchSize: "2"
      DataMigration__Sources__SS__Jobs__Training__BatchSize: "2"
      DataMigration__Sources__SS__Jobs__Scheduling__BatchSize: "2"
    volumes:
      - rollback-restricted:/restricted
volumes:
  rollback-restricted:
