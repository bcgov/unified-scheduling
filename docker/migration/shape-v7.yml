services:
  shape-source:
    image: postgres:12-alpine@sha256:7c8f4870583184ebadf7f17a6513620aac5f365a7938dc6a6911c1d5df2f481a
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - source-shape-v7:/var/lib/postgresql/data
      - ../../docs/data-migration/ss-implementation-baseline/evidence/ss-schema-noseed.sql:/fixture/schema.sql:ro
    networks: [migration]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 60
volumes:
  source-shape-v7:
