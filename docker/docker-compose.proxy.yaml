# Opt in alongside docker-compose.yaml; leave the development services unchanged.
services:
  web-release:
    image: '${PROXY_WEB_IMAGE:-ghcr.io/bcgov/unified-scheduling/web:1.3.4}'
    profiles: [proxy-repro]
    environment:
      WEB_BASE_HREF: /sheriff-scheduling/
      API_URL: http://api:5000/api/
      API_PATH: /api/
      # Public-host rules in this release imply HTTPS; use its HTTP fallback locally.
      PUBLIC_HOST_ALLOWLIST: ''
    ports:
      - '127.0.0.1:9080:8080'
    depends_on:
      - api
    restart: unless-stopped

  proxy:
    image: nginx:stable
    profiles: [proxy-repro]
    ports:
      - '127.0.0.1:3000:8080'
    volumes:
      - './nginx-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro'
    depends_on:
      - web-release
    restart: unless-stopped
