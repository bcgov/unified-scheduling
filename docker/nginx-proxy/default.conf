# Loaded in the official image's http context. A rejected request has no upstream.
log_format proxy_repro '$remote_addr "$request" status=$status '
                       'upstream_status=$upstream_status upstream_addr=$upstream_addr';

server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    # Match the release runtime's limit for incoming cookie/header fields.
    large_client_header_buffers 4 32k;

    access_log /var/log/nginx/access.log proxy_repro;

    location /sheriff-scheduling/ {
        # No URI suffix: the release runtime owns prefix removal and API routing.
        proxy_pass http://web-release:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser connects to 3000, while this container listens on 8080.
        proxy_set_header X-Forwarded-Port 3000;
        # Do not activate the release runtime's public HTTPS authority mapping.
        proxy_set_header X-Forwarded-Server '';
        # Match the release runtime: renewed session cookies can exceed Nginx defaults.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 600s;
    }

    # Includes /api, /api/*, /, and unprefixed assets; never fall back to the SPA.
    location / {
        return 404;
    }
}
