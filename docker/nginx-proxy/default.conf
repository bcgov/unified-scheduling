# Loaded in the official image's http context. A rejected request has no upstream.
log_format proxy_repro '$remote_addr "$request" status=$status '
                       'upstream_status=$upstream_status upstream_addr=$upstream_addr';

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    # Leave request-size limits to the API, as in direct Vite mode.
    client_max_body_size 0;

    # Match the release runtime's limit for incoming cookie/header fields.
    large_client_header_buffers 4 32k;

    access_log /var/log/nginx/access.log proxy_repro;

    location /sheriff-scheduling/ {
        # No URI suffix: Vite receives the prefix and owns API rewriting.
        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_set_header X-Forwarded-Server '';
        # Match the release runtime: renewed session cookies can exceed Nginx defaults.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 600s;
    }

    # Includes /api/*, /hangfire/*, /, and unprefixed assets; no SPA fallback.
    location / {
        return 404;
    }
}
