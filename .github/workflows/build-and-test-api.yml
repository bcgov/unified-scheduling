name: Build and Test API

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "api/**"
      - "db/**"
      - "jc-interface-client/**"
      - "unified.slnx"
      - "global.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/build-and-test-api.yml"
      - ".github/actions/build-api/**"

  workflow_dispatch:

env:
  WORKING_DIRECTORY: .
  NUGET_CERT_REVOCATION_MODE: offline

jobs:
  build-and-test-api:
    name: Build and Test API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d #v4.0.3
        id: filter
        with:
          list-files: shell
          filters: |
            api:
              - 'api/**'
              - 'db/**'
              - 'jc-interface-client/**'
              - 'unified.slnx'
              - 'global.json'
              - '.config/dotnet-tools.json'
              - '.github/workflows/build-and-test-api.yml'
              - '.github/actions/build-api/**'

      - name: Find csproj files
        if: steps.filter.outputs.api == 'true'
        id: find-csproj
        run: |
          csproj_files=()
          for file in ${{ steps.filter.outputs.api_files }}; do
            echo "$file was changed"
            dir="./$file"
            while [[ $dir != "." && $dir != "/" && $dir != $GITHUB_WORKSPACE ]]; do
              if find "$dir" -maxdepth 1 -name "*.csproj" -print -quit | grep -q .; then
                csproj_files+=("$(find "$dir" -maxdepth 1 -name "*.csproj" -print -quit)")
                break
              fi
              dir=$(echo ${dir%/*})
            done
          done
          csproj_files=($(printf "%s\n" "${csproj_files[@]}" | sort -u))
          echo "Found ${#csproj_files[@]} unique csproj/sln files: ${csproj_files[*]}"
          echo "csproj_files=${csproj_files[*]}" >> $GITHUB_OUTPUT

      - name: Setup .NET
        if: steps.filter.outputs.api == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dotnet tools
        if: steps.filter.outputs.api == 'true'
        run: dotnet tool restore

      - name: Check CSharpier Formatting
        if: steps.filter.outputs.api == 'true' && steps.find-csproj.outputs.csproj_files != ''
        run: |
          for csproj in ${{ steps.find-csproj.outputs.csproj_files }}; do
            project_dir=$(dirname "$csproj")
            echo "Checking CSharpier formatting for $project_dir"
            dotnet csharpier check "$project_dir"
          done

      - name: Check Dotnet Format (Style)
        if: steps.filter.outputs.api == 'true' && steps.find-csproj.outputs.csproj_files != ''
        run: |
          for csproj in ${{ steps.find-csproj.outputs.csproj_files }}; do
            echo "Checking style formatting for $csproj"
            dotnet format style $csproj --verify-no-changes --verbosity diagnostic
          done

      - name: Check Dotnet Format (Analyzers)
        if: steps.filter.outputs.api == 'true' && steps.find-csproj.outputs.csproj_files != ''
        run: |
          for csproj in ${{ steps.find-csproj.outputs.csproj_files }}; do
            echo "Checking analyzers for $csproj"
            dotnet format analyzers $csproj --verify-no-changes --verbosity diagnostic
          done

      - name: Build API codebase
        if: steps.filter.outputs.api == 'true'
        id: build-api
        uses: ./.github/actions/build-api
        with:
          working_directory: ${{ env.WORKING_DIRECTORY }}
          dotnet_version: 10.0

      - name: Run tests
        if: steps.filter.outputs.api == 'true'
        id: test
        run: |
          dotnet test --no-build --configuration Release --verbosity minimal \
            --results-directory "$RUNNER_TEMP/test-results" \
            --logger "trx;LogFilePrefix=test-results"
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Summary
        if: always()
        env:
          API_CHANGES: ${{ steps.filter.outputs.api }}
          BUILD_OUTCOME: ${{ steps.build-api.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          TEST_RESULTS_DIRECTORY: ${{ runner.temp }}/test-results
        run: |
          {
            echo "## Build and Test API"
            if [[ "$API_CHANGES" == "true" ]]; then
              echo "- Reason: API build inputs changed"
            else
              echo "- Reason: no API build inputs changed"
            fi
            echo "- API build: ${BUILD_OUTCOME:-skipped}"
            echo "- Tests: ${TEST_OUTCOME:-skipped}"

            if [[ "$TEST_OUTCOME" != "skipped" ]]; then
              echo
              echo "### Test summary"
              python3 - "$TEST_RESULTS_DIRECTORY" <<'PY'
          import sys
          import xml.etree.ElementTree as ElementTree
          from datetime import datetime
          from pathlib import Path

          results_directory = Path(sys.argv[1])
          result_files = sorted(results_directory.glob("*.trx"))
          if not result_files:
              print("- Test results: no TRX files produced")
              raise SystemExit(0)

          totals = {"total": 0, "passed": 0, "failed": 0, "skipped": 0}
          duration_seconds = 0.0
          failed_outcomes = {"failed", "error", "timeout", "aborted"}
          skipped_outcomes = {"notexecuted", "notrunnable", "inconclusive", "warning"}

          for result_file in result_files:
              root = ElementTree.parse(result_file).getroot()
              for result in root.findall(".//{*}UnitTestResult"):
                  totals["total"] += 1
                  outcome = result.get("outcome", "").lower()
                  if outcome == "passed":
                      totals["passed"] += 1
                  elif outcome in failed_outcomes:
                      totals["failed"] += 1
                  elif outcome in skipped_outcomes:
                      totals["skipped"] += 1

              times = root.find(".//{*}Times")
              if times is not None and times.get("start") and times.get("finish"):
                  start = datetime.fromisoformat(times.get("start").replace("Z", "+00:00"))
                  finish = datetime.fromisoformat(times.get("finish").replace("Z", "+00:00"))
                  duration_seconds += (finish - start).total_seconds()

          print(f"- Total: {totals['total']}")
          print(f"- Passed: {totals['passed']}")
          print(f"- Failed: {totals['failed']}")
          print(f"- Skipped: {totals['skipped']}")
          print(f"- Duration: {duration_seconds:.2f}s")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"
