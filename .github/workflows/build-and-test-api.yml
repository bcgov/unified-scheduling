name: Build and Test API

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "api/**"
      - "db/**"
      - "jc-interface-client/**"
      - "unified.slnx"
      - "global.json"
      - ".config/dotnet-tools.json"
      - ".github/workflows/build-and-test-api.yml"
      - ".github/actions/build-api/**"

  workflow_dispatch:

env:
  WORKING_DIRECTORY: .
  NUGET_CERT_REVOCATION_MODE: offline

jobs:
  build-and-test-api:
    name: Build and Test API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d #v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'db/**'
              - 'jc-interface-client/**'
              - 'unified.slnx'
              - 'global.json'
              - '.config/dotnet-tools.json'
              - '.github/workflows/build-and-test-api.yml'
              - '.github/actions/build-api/**'

      - name: Get changed files
        if: steps.filter.outputs.api == 'true'
        id: changed-files
        uses: jitterbit/get-changed-files@b17fbb00bdc0c0f63fcf166580804b4d2cdc2a42 #v1
        continue-on-error: true

      - name: Find csproj files
        if: steps.filter.outputs.api == 'true'
        id: find-csproj
        run: |
          csproj_files=()
          if [[ ${{ steps.changed-files.outcome }} == 'success' ]]; then
            for file in ${{ steps.changed-files.outputs.added_modified }}; do
              echo "$file was changed"
              dir="./$file"
              while [[ $dir != "." && $dir != "/" && $dir != $GITHUB_WORKSPACE ]]; do
                if find "$dir" -maxdepth 1 -name "*.csproj" -print -quit | grep -q .; then
                  csproj_files+=("$(find "$dir" -maxdepth 1 -name "*.csproj" -print -quit)")
                  break
                fi
                dir=$(echo ${dir%/*})
              done
            done
          else
            # if the changed-files step failed, run on the whole sln instead
            echo "Running checks on whole solution"
            csproj_files=$(find ./ -type f -name "*.sln" | tr '\n' ' ');
          fi
          csproj_files=($(printf "%s\n" "${csproj_files[@]}" | sort -u))
          echo "Found ${#csproj_files[@]} unique csproj/sln files: ${csproj_files[*]}"
          echo "csproj_files=${csproj_files[*]}" >> $GITHUB_OUTPUT

      - name: Setup .NET
        if: steps.filter.outputs.api == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dotnet tools
        if: steps.filter.outputs.api == 'true'
        run: dotnet tool restore

      - name: Check CSharpier Formatting
        if: steps.filter.outputs.api == 'true' && steps.find-csproj.outputs.csproj_files != ''
        run: |
          for csproj in ${{ steps.find-csproj.outputs.csproj_files }}; do
            project_dir=$(dirname "$csproj")
            echo "Checking CSharpier formatting for $project_dir"
            dotnet csharpier check "$project_dir"
          done

      - name: Check Dotnet Format (Style)
        if: steps.filter.outputs.api == 'true' && steps.find-csproj.outputs.csproj_files != ''
        run: |
          for csproj in ${{ steps.find-csproj.outputs.csproj_files }}; do
            echo "Checking style formatting for $csproj"
            dotnet format style $csproj --verify-no-changes --verbosity diagnostic
          done

      - name: Check Dotnet Format (Analyzers)
        if: steps.filter.outputs.api == 'true' && steps.find-csproj.outputs.csproj_files != ''
        run: |
          for csproj in ${{ steps.find-csproj.outputs.csproj_files }}; do
            echo "Checking analyzers for $csproj"
            dotnet format analyzers $csproj --verify-no-changes --verbosity diagnostic
          done

      - name: Build API codebase
        if: steps.filter.outputs.api == 'true'
        id: build-api
        uses: ./.github/actions/build-api
        with:
          working_directory: ${{ env.WORKING_DIRECTORY }}
          dotnet_version: 10.0

      - name: Run tests
        if: steps.filter.outputs.api == 'true'
        id: test
        run: |
          set -o pipefail
          dotnet test --no-build --configuration Release --verbosity minimal 2>&1 | tee "$RUNNER_TEMP/dotnet-test-output.txt"
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Summary
        if: always()
        env:
          API_CHANGES: ${{ steps.filter.outputs.api }}
          BUILD_OUTCOME: ${{ steps.build-api.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          TEST_OUTPUT: ${{ runner.temp }}/dotnet-test-output.txt
        run: |
          {
            echo "## Build and Test API"
            if [[ "$API_CHANGES" == "true" ]]; then
              echo "- Reason: API build inputs changed"
            else
              echo "- Reason: no API build inputs changed"
            fi
            echo "- API build: ${BUILD_OUTCOME:-skipped}"
            echo "- Tests: ${TEST_OUTCOME:-skipped}"

            if [[ "$TEST_OUTCOME" != "skipped" && -f "$TEST_OUTPUT" ]]; then
              echo
              echo "### Test output"
              cat "$TEST_OUTPUT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
